# Render Blueprint: one-click deploy of the web service plus a managed PostgreSQL database.
services:
  - type: web
    name: cybershield
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: ABUSEIPDB_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: cybershield-db
          property: connectionString
databases:
  - name: cybershield-db
    plan: free
